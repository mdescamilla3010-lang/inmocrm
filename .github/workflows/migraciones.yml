name: Migraciones a producción

# Botón manual (Actions → "Migraciones a producción" → Run workflow) para
# aplicar supabase/migrations al proyecto de Supabase de producción sin usar la
# terminal. Nunca carga seed.sql (usuarios de prueba). Pasos en docs/despliegue.md.
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personal (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   código del proyecto (la parte de la URL tras /project/)
#   SUPABASE_DB_PASSWORD   contraseña de la base de datos
#
# `supabase link` obtiene del API la dirección del pooler de conexiones: los
# runners de GitHub no tienen IPv6 y la conexión directa de Supabase sólo es IPv6.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "simular: sólo muestra qué se aplicaría. aplicar: cambia la base."
        type: choice
        options:
          - simular
          - aplicar
        default: simular

concurrency:
  group: migraciones-produccion
  cancel-in-progress: false

jobs:
  migrar:
    name: Migraciones (${{ inputs.modo }})
    # Sólo desde main: lo que se aplica es lo que ya pasó la CI.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Revisar secretos
        run: |
          faltan=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || faltan="$faltan SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_PROJECT_REF" ] || faltan="$faltan SUPABASE_PROJECT_REF"
          [ -n "$SUPABASE_DB_PASSWORD" ] || faltan="$faltan SUPABASE_DB_PASSWORD"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos:$faltan (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if ! echo "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF debe ser sólo el código de 20 letras (sin https:// ni .supabase.co)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conectar con el proyecto
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Migraciones pendientes (simulación)
        run: pnpm exec supabase db push --remote --dry-run --skip-vault --yes
      - name: Aplicar migraciones
        if: inputs.modo == 'aplicar'
        run: pnpm exec supabase db push --remote --skip-vault --yes
